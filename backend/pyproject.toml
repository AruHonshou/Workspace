[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "amework-backend"
version = "2.0.0"
description = "Local-first job search and evidence-grounded career assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "keyring>=25.6,<27",
  "python-multipart>=0.0.20,<1",
  "python-docx>=1.1,<2",
  "pycountry>=24.6,<27",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ocr = ["pillow>=11,<13", "pymupdf>=1.25,<2", "pytesseract>=0.3.13,<1"]
test = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
amework = "job_orchestrator.main:run"

[tool.hatch.build.targets.wheel]
packages = ["job_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
