<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none" role="img" aria-labelledby="desk-title desk-description">
  <title id="desk-title">A quiet desk, seen from your seat</title>
  <desc id="desk-description">A dark ultrawide monitor centered over a wooden desk, with a compact ivory and sage keyboard, a mouse and coffee on the right, and plants and a warm lamp at the edges.</desc>
  <defs>
    <linearGradient id="room" x1="800" y1="0" x2="800" y2="690" gradientUnits="userSpaceOnUse"><stop stop-color="#101b21"/><stop offset="1" stop-color="#283a39"/></linearGradient>
    <radialGradient id="room-light" cx=".45" cy=".65" r=".65"><stop stop-color="#8ea595" stop-opacity=".19"/><stop offset="1" stop-color="#8ea595" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp-glow"><stop stop-color="#efd4a0" stop-opacity=".2"/><stop offset="1" stop-color="#efd4a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood" x1="800" y1="620" x2="800" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#927453"/><stop offset=".5" stop-color="#9c7956"/><stop offset="1" stop-color="#73563f"/></linearGradient>
    <linearGradient id="bezel" x1="334" y1="203" x2="1260" y2="626" gradientUnits="userSpaceOnUse"><stop stop-color="#606b68"/><stop offset=".3" stop-color="#253230"/><stop offset=".74" stop-color="#182321"/><stop offset="1" stop-color="#46534d"/></linearGradient>
    <linearGradient id="stand" x1="769" y1="613" x2="829" y2="688" gradientUnits="userSpaceOnUse"><stop stop-color="#414e46"/><stop offset="1" stop-color="#1d2926"/></linearGradient>
    <linearGradient id="keyboard-case" x1="600" y1="700" x2="600" y2="848" gradientUnits="userSpaceOnUse"><stop stop-color="#7a8b76"/><stop offset="1" stop-color="#364b41"/></linearGradient>
    <linearGradient id="key-top" x1="0" y1="0" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#e9e8d6"/><stop offset="1" stop-color="#c7ccbb"/></linearGradient>
    <linearGradient id="sage-key-top" x1="0" y1="0" x2="0" y2="22" gradientUnits="userSpaceOnUse"><stop stop-color="#93a78d"/><stop offset="1" stop-color="#6f8a72"/></linearGradient>
    <linearGradient id="ceramic" x1="1297" y1="674" x2="1360" y2="708" gradientUnits="userSpaceOnUse"><stop stop-color="#eee6cd"/><stop offset=".6" stop-color="#c7c4ac"/><stop offset="1" stop-color="#9b9f8b"/></linearGradient>
    <linearGradient id="pot" x1="82" y1="570" x2="180" y2="639" gradientUnits="userSpaceOnUse"><stop stop-color="#727c65"/><stop offset="1" stop-color="#3b5146"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="60" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#7c9472"/><stop offset="1" stop-color="#354e3d"/></linearGradient>
    <g id="key">
      <rect y="4" width="28" height="24" rx="4" fill="#778574"/><rect width="28" height="23" rx="4" fill="url(#key-top)"/>
      <path d="M5 6h5" stroke="#788877" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>
    </g>
    <g id="sage-key">
      <rect y="4" width="28" height="24" rx="4" fill="#496350"/><rect width="28" height="23" rx="4" fill="url(#sage-key-top)"/>
      <path d="M5 6h5" stroke="#d0d7bf" stroke-width="1.5" stroke-linecap="round" opacity=".65"/>
    </g>
    <g id="key-row">
      <use href="#key"/><use href="#key" x="32"/><use href="#key" x="64"/><use href="#key" x="96"/><use href="#key" x="128"/><use href="#key" x="160"/>
      <use href="#key" x="192"/><use href="#key" x="224"/><use href="#key" x="256"/><use href="#key" x="288"/><use href="#key" x="320"/><use href="#key" x="352"/>
    </g>
    <g id="plant-leaf">
