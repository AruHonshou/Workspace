name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest
      - run: uv run ruff check .

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: uv sync --project backend --all-extras --dev
      - run: pnpm install --frozen-lockfile
      - shell: pwsh
        run: ./scripts/generate-contracts.ps1
      - run: git diff --exit-code -- frontend/src/generated
      - shell: pwsh
        run: ./scripts/validate-assets.ps1
      - shell: pwsh
        run: ./scripts/scan-secrets.ps1
      - shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -Include *.fbx,*.usdz,*.cv.pdf,*.resume.pdf
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Error "Forbidden tracked file: $($_.FullName)" }
            exit 1
          }
      - shell: pwsh
        run: ./scripts/generate-sbom.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: output/sbom

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
